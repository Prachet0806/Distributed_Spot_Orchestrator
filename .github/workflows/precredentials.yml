name: Pre-credential validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev-linux.lock
      - run: python -m pip install -r requirements-dev-linux.lock
      - run: python -m pytest -q --disable-warnings --tb=short
      - run: python scripts/run_local_lab.py --mode services --output lab-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precredential-service-evidence
          path: lab-results/

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
      - run: terraform -chdir=infra/aws fmt -check dynamodb.tf iam.tf main.tf
      - run: terraform -chdir=infra/aws init -backend=false -input=false
      - run: terraform -chdir=infra/aws validate -no-color
